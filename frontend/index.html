<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Polytechnic Muzaffarpur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <style>
      :root { --loader-bg:#07152c; --loader-text:#fff; --loader-line:linear-gradient(90deg,#1688ff,#22b7f2,#ffb52b); }
      * { box-sizing:border-box; }
      html,body { min-height:100%; margin:0; }
      body { overflow:hidden; font-family:'Poppins',system-ui,sans-serif; }
      body.page-loaded { overflow:auto; }
      #root { min-height:100vh; }
      .pl-screen { position:fixed; inset:0; z-index:99999; overflow:hidden; color:var(--loader-text); background:var(--loader-bg); isolation:isolate; transition:transform .8s cubic-bezier(.76,0,.24,1); }
      .pl-screen.exitpage { transform:translateY(-100%); }
      .pl-video { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:center; filter:saturate(1.04); }
      .pl-bg { position:absolute; z-index:-1; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(4,14,31,.60),rgba(4,14,31,.22) 50%,rgba(4,14,31,.62)),linear-gradient(0deg,rgba(4,14,31,.76),transparent 35%,rgba(4,14,31,.24)); }
      .pl-intro { position:absolute; z-index:2; top:47%; right:16px; left:16px; display:flex; flex-direction:column; align-items:center; transform:translateY(-50%); text-align:center; }
      .pl-crest-wrap { position:relative; display:grid; width:clamp(230px,32vw,360px); aspect-ratio:1; place-items:center; margin-bottom:15px; }
      .pl-halo { position:absolute; inset:10%; border-radius:50%; background:rgba(22,136,255,.42); filter:blur(52px); animation:halo-pulse 2.8s ease-in-out infinite alternate; }
      .pl-brand-image { position:relative; z-index:1; display:block; width:100%; height:100%; border:1px solid rgba(255,255,255,.14); border-radius:28px; object-fit:contain; box-shadow:0 28px 90px rgba(0,0,0,.38); opacity:0; transform:translateY(14px) scale(.94); animation:logo-in .8s cubic-bezier(.22,1,.36,1) .12s forwards, brand-float 5s ease-in-out 1s infinite; }
      .pl-title { display:flex; flex-direction:column; margin:0; color:#fff; font-size:clamp(23px,3.2vw,42px); font-weight:700; line-height:1.12; letter-spacing:.075em; text-transform:uppercase; text-shadow:0 5px 24px rgba(0,0,0,.48); }
      .pl-title-line { display:block; white-space:nowrap; }
      .pl-letter { display:inline-block; opacity:0; transform:translateY(14px); animation:title-letter .42s cubic-bezier(.22,1,.36,1) calc(.6s + var(--i)*.025s) forwards; }
      .pl-tagline { margin:12px 0 0; color:rgba(255,255,255,.82); font-size:clamp(9px,.78vw,12px); font-weight:500; letter-spacing:.32em; text-transform:uppercase; opacity:0; animation:tagline-appear .6s ease 1.9s forwards; }
      .pl-progress { position:absolute; z-index:4; right:clamp(20px,3vw,46px); bottom:26px; left:clamp(20px,3vw,46px); display:grid; grid-template-columns:auto minmax(80px,1fr) auto; align-items:center; gap:16px; color:rgba(255,255,255,.68); font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
      .pl-status { white-space:nowrap; }
      .pl-track { height:3px; overflow:hidden; border-radius:9px; background:rgba(255,255,255,.12); }
      .pl-fill { width:0; height:100%; border-radius:inherit; background:var(--loader-line); transition:width .1s linear; }
      .pl-pct { min-width:38px; color:#fff; text-align:right; }
      .pl-skip-btn { position:absolute; z-index:5; right:clamp(20px,3vw,46px); bottom:62px; display:flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid rgba(255,255,255,.2); border-radius:999px; color:rgba(255,255,255,.78); background:rgba(255,255,255,.05); font:600 10px/1 'Poppins',system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
      .pl-skip-btn:hover { color:#fff; background:rgba(255,255,255,.1); }
      @keyframes logo-in { to { opacity:1; transform:scale(1); } }
      @keyframes brand-float { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
      @keyframes halo-pulse { from { opacity:.42; transform:scale(.86); } to { opacity:.9; transform:scale(1.08); } }
      @keyframes title-letter { to { opacity:1; transform:translateY(0); } }
      @keyframes tagline-appear { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @media (max-width:760px) {
        .pl-intro { right:10px; left:10px; }
        .pl-crest-wrap { width:min(48vw,250px); margin-bottom:8px; }
        .pl-brand-image { border-radius:22px; }
        .pl-title { font-size:clamp(19px,5.1vw,32px); letter-spacing:.06em; }
        .pl-tagline { max-width:90vw; margin-top:9px; font-size:8px; letter-spacing:.18em; }
        .pl-progress { bottom:20px; grid-template-columns:auto minmax(48px,1fr) auto; gap:9px; font-size:8px; letter-spacing:.08em; }
        .pl-skip-btn { right:20px; bottom:54px; padding:8px 11px; font-size:9px; }
      }
      @media (max-width:420px) {
        .pl-crest-wrap { width:min(46vw,220px); }
        .pl-title { font-size:18px; letter-spacing:.035em; }
        .pl-tagline { letter-spacing:.12em; }
        .pl-status { max-width:106px; white-space:normal; }
      }
      @media (prefers-reduced-motion:reduce) {
        .pl-screen *, .pl-screen::before, .pl-screen::after { animation-duration:.01ms!important; animation-delay:0s!important; animation-iteration-count:1!important; }
      }
      /* The intro is intentionally a clean, unframed video view. */
      .pl-screen { background:#07152c; transition:opacity .7s ease; }
      .pl-screen.exitpage { opacity:0; transform:none; pointer-events:none; }
      .pl-video { z-index:0; object-fit:cover; object-position:center; filter:none; background:#07152c; }
      .pl-bg, .pl-intro, .pl-progress, .pl-skip-btn { display:none!important; }
      .pl-skip-intro { position:absolute; z-index:2; right:max(20px,env(safe-area-inset-right)); bottom:max(20px,env(safe-area-inset-bottom)); padding:11px 17px; border:1px solid rgba(255,255,255,.48); border-radius:999px; color:#fff; background:rgba(7,21,44,.72); font:600 12px/1 'Poppins',system-ui,sans-serif; letter-spacing:.04em; cursor:pointer; backdrop-filter:blur(8px); transition:background .2s ease,transform .2s ease; }
      .pl-skip-intro:hover { background:rgba(7,21,44,.92); transform:translateY(-1px); }
      .pl-skip-intro:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    </style>
  </head>
  <body>
    <noscript><style>.pl-screen{display:none}body{overflow:auto}</style></noscript>
    <main class="pl-screen" id="pageloder" aria-label="Campus introduction">
      <video class="pl-video" autoplay muted playsinline preload="auto" aria-hidden="true" tabindex="-1">
        <source src="/campus-intro.mp4" type="video/mp4" />
      </video>
      <button class="pl-skip-intro" id="skipIntro" type="button">Skip intro</button>
    </main>
    <div id="root"></div>
    <script>
      (() => {
        const pre = document.getElementById('pageloder');
        const video = pre.querySelector('video');
        let exited = false;
        function exit() {
          if (exited) return;
          exited = true;
          pre.classList.add('exitpage');
          document.body.classList.add('page-loaded');
          setTimeout(() => pre.remove(), 750);
        }
        video.addEventListener('ended', exit, { once:true });
        video.addEventListener('error', exit, { once:true });
        document.getElementById('skipIntro').addEventListener('click', exit);
        video.play().catch(exit);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
