<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Polytechnic Muzaffarpur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <style>
      :root { --loader-bg:#0A1630; --loader-text:#fff; --loader-line:linear-gradient(90deg,#05AF6B,#056DB5 38%,#8D288C 68%,#EF4D24); }
      * { box-sizing:border-box; }
      html,body { min-height:100%; margin:0; }
      body { overflow:hidden; font-family:'Poppins',system-ui,sans-serif; }
      body.page-loaded { overflow:auto; }
      #root { min-height:100vh; }
      .pl-screen { position:fixed; inset:0; z-index:99999; overflow:hidden; color:var(--loader-text); background:var(--loader-bg); isolation:isolate; transition:transform .8s cubic-bezier(.76,0,.24,1); }
      .pl-screen.exitpage { transform:translateY(-100%); }
      .pl-bg { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 38%,rgba(5,109,181,.22),transparent 42%),linear-gradient(145deg,#0A1630,#0A1630 72%,#11162f); }
      .pl-intro { position:absolute; z-index:2; top:47%; right:16px; left:16px; display:flex; flex-direction:column; align-items:center; transform:translateY(-50%); text-align:center; }
      .pl-crest-wrap { position:relative; display:grid; width:174px; height:174px; place-items:center; margin-bottom:14px; }
      .pl-halo { position:absolute; inset:16px; border-radius:50%; background:rgba(5,109,181,.32); filter:blur(28px); animation:halo-pulse 2.8s ease-in-out infinite alternate; }
      .pl-brand-mark { position:relative; z-index:1; display:grid; width:126px; height:126px; place-items:center; border:1px solid rgba(233,200,118,.7); border-radius:30px; background:linear-gradient(145deg,rgba(18,48,83,.98),rgba(7,18,39,.98)); box-shadow:0 16px 48px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14); opacity:0; transform:scale(.84); animation:logo-in .7s cubic-bezier(.22,1,.36,1) .12s forwards; }
      .pl-brand-mark svg { width:96px; height:96px; overflow:visible; }
      .pl-brand-mark .mark-flame { transform-origin:60px 33px; animation:flame-pulse 1.6s ease-in-out infinite alternate; }
      .pl-title { display:flex; flex-direction:column; margin:0; color:#fff; font-size:clamp(25px,4vw,48px); font-weight:700; line-height:1.12; letter-spacing:.09em; text-transform:uppercase; text-shadow:0 5px 24px rgba(0,0,0,.22); }
      .pl-title-line { display:block; white-space:nowrap; }
      .pl-letter { display:inline-block; opacity:0; transform:translateY(14px); animation:title-letter .42s cubic-bezier(.22,1,.36,1) calc(.6s + var(--i)*.025s) forwards; }
      .pl-tagline { margin:12px 0 0; color:rgba(255,255,255,.65); font-size:clamp(9px,.78vw,12px); font-weight:500; letter-spacing:.32em; text-transform:uppercase; opacity:0; animation:tagline-appear .6s ease 1.9s forwards; }
      .pl-progress { position:absolute; z-index:4; right:clamp(20px,3vw,46px); bottom:26px; left:clamp(20px,3vw,46px); display:grid; grid-template-columns:auto minmax(80px,1fr) auto; align-items:center; gap:16px; color:rgba(255,255,255,.68); font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
      .pl-status { white-space:nowrap; }
      .pl-track { height:3px; overflow:hidden; border-radius:9px; background:rgba(255,255,255,.12); }
      .pl-fill { width:0; height:100%; border-radius:inherit; background:var(--loader-line); transition:width .1s linear; }
      .pl-pct { min-width:38px; color:#fff; text-align:right; }
      .pl-skip-btn { position:absolute; z-index:5; right:clamp(20px,3vw,46px); bottom:62px; display:flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid rgba(255,255,255,.2); border-radius:999px; color:rgba(255,255,255,.78); background:rgba(255,255,255,.05); font:600 10px/1 'Poppins',system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
      .pl-skip-btn:hover { color:#fff; background:rgba(255,255,255,.1); }
      @keyframes logo-in { to { opacity:1; transform:scale(1); } }
      @keyframes flame-pulse { to { transform:translateY(-2px) scale(1.06); opacity:.78; } }
      @keyframes halo-pulse { from { opacity:.42; transform:scale(.86); } to { opacity:.9; transform:scale(1.08); } }
      @keyframes title-letter { to { opacity:1; transform:translateY(0); } }
      @keyframes tagline-appear { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @media (max-width:760px) {
        .pl-intro { right:10px; left:10px; }
        .pl-crest-wrap { width:150px; height:150px; margin-bottom:8px; }
        .pl-brand-mark { width:110px; height:110px; border-radius:26px; }
        .pl-brand-mark svg { width:84px; height:84px; }
        .pl-title { font-size:clamp(19px,5.1vw,32px); letter-spacing:.06em; }
        .pl-tagline { max-width:90vw; margin-top:9px; font-size:8px; letter-spacing:.18em; }
        .pl-progress { bottom:20px; grid-template-columns:auto minmax(48px,1fr) auto; gap:9px; font-size:8px; letter-spacing:.08em; }
        .pl-skip-btn { right:20px; bottom:54px; padding:8px 11px; font-size:9px; }
      }
      @media (max-width:420px) {
        .pl-crest-wrap { width:136px; height:136px; }
        .pl-brand-mark { width:102px; height:102px; border-radius:24px; }
        .pl-brand-mark svg { width:78px; height:78px; }
        .pl-title { font-size:18px; letter-spacing:.035em; }
        .pl-tagline { letter-spacing:.12em; }
        .pl-status { max-width:106px; white-space:normal; }
      }
      @media (prefers-reduced-motion:reduce) {
        .pl-screen *, .pl-screen::before, .pl-screen::after { animation-duration:.01ms!important; animation-delay:0s!important; animation-iteration-count:1!important; }
      }
    </style>
  </head>
  <body>
    <noscript><style>.pl-screen{display:none}body{overflow:auto}</style></noscript>
    <main class="pl-screen" id="pageloder" aria-label="Government Polytechnic Muzaffarpur introduction">
      <div class="pl-bg" aria-hidden="true"></div>
      <section class="pl-intro" aria-label="College introduction">
                <div class="pl-crest-wrap">
          <div class="pl-halo"></div>
          <div class="pl-brand-mark" role="img" aria-label="GPM learning and innovation mark">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="53" fill="none" stroke="rgba(233,200,118,.3)" stroke-width="1"/>
              <path d="M22 49 Q41 39 60 50 Q79 39 98 49 V82 Q79 73 60 84 Q41 73 22 82 Z" fill="none" stroke="#eaf4ff" stroke-width="4" stroke-linejoin="round"/>
              <path d="M60 50 V84 M30 56 Q43 51 53 57 M30 66 Q43 61 53 67 M67 57 Q78 51 90 56 M67 67 Q78 61 90 66" fill="none" stroke="#45b9f4" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M60 21 L55 34 H65 L59 47" fill="none" stroke="#e9c876" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="mark-flame" d="M60 12 C52 21 54 27 60 31 C66 27 68 21 60 12Z" fill="#ffb52b"/>
              <text x="60" y="105" fill="#fff" font-family="Poppins, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">GPM</text>
            </svg>
          </div>
        </div>
        <h1 class="pl-title" id="collegeName" aria-label="Government Polytechnic Muzaffarpur"><span class="pl-title-line" data-text="Government Polytechnic"></span><span class="pl-title-line" data-text="Muzaffarpur"></span></h1>
        <p class="pl-tagline">Excellence · Integrity · Innovation</p>
      </section>
<div class="pl-progress">
        <span class="pl-status" id="loaderStatus">Beginning the campus journey</span>
        <div class="pl-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Loading"><div class="pl-fill" id="loaderBar"></div></div>
        <span class="pl-pct"><span id="loaderPct">0</span>%</span>
      </div>
      <button type="button" class="pl-skip-btn" id="loaderSkip" aria-label="Skip introduction"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>Skip Intro</button>
    </main>
    <div id="root"></div>
    <script>
      (() => {
        const pre = document.getElementById('pageloder');
        const titleLines = document.querySelectorAll('.pl-title-line');
        const pctEl = document.getElementById('loaderPct');
        const barEl = document.getElementById('loaderBar');
        const statusEl = document.getElementById('loaderStatus');
        const track = document.querySelector('.pl-track');
        const skip = document.getElementById('loaderSkip');
        const duration = 5000;
        let index = 0;
        titleLines.forEach(line => { line.innerHTML = [...line.dataset.text].map(char => `<span class="pl-letter" style="--i:${index++}">${char === ' ' ? '&nbsp;' : char}</span>`).join(''); });
        const start = performance.now();
        let exited = false;
        function exit() { if (exited) return; exited = true; pre.classList.add('exitpage'); document.body.classList.add('page-loaded'); setTimeout(() => pre.remove(), 950); }
        function tick(now) {
          if (exited) return;
          const value = Math.min(100, Math.floor(((now - start) / duration) * 100));
          pctEl.textContent = value;
          barEl.style.width = `${value}%`;
          track.setAttribute('aria-valuenow', value);
          statusEl.textContent = value < 24 ? 'Beginning the campus journey' : value < 55 ? 'Walking into a brighter future' : value < 82 ? 'Discovering GPM Muzaffarpur' : 'Welcome to GPM';
          if (value < 100) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        const timer = setTimeout(exit, duration);
        skip.addEventListener('click', () => { clearTimeout(timer); exit(); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
